default_values:
  # default
  seed: 0
  n_points: 500
  theta_ref: 1.57075 #pi/2
  noise: 0.2
  n_correlated_dims: 3
  n_uncorrelated_dims: 0

  # experiment configs
  n_repeat: 100
  n_trials: 30

  # Sweep bounds
  theta_min: 0
  theta_max: 3.1415
  n_thetas: 20
  
models:
  krr_model:
    model_name: KernelRidgeRegression
    parameters:
      kernel: rbf
      bandwidth: 1
      reg: 1e-9
    hyperparameters:
      shared:
        bandwidth:
          type: float
          min: 0.1
          max: 10
      owned:
        reg:
          type: float
          min: 1e-12
          max: 1e-4

  eigen_rascutti:
    model_name: EigenGausRascutti
    parameters:
      bandwidth: 1
      lam: 1e-9
      rho: 1e-9
    hyperparameters:
      shared:
        bandwidth:
          type: float
          min: 0.1
          max: 8
      owned:
        lam:
          type: float
          min: 1e-12
          max: 1e-4
        rho:
          type: float
          min: 1e-12
          max: 1e-4

