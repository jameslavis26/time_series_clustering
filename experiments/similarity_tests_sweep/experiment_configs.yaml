default_values:
  # default
  seed: 0
  n_points: 100
  theta_ref: 1.57075 #pi/2
  noise: 0.2
  n_correlated_dims: 3
  n_uncorrelated_dims: 0

  # experiment configs
  n_repeat: 1
  n_trials: 30

  # Sweep bounds
  theta_min: 0
  theta_max: 3.1415
  n_thetas: 20
  
models:
  krr_model:
    model_name: KernelRidgeRegression
    parameters:
      kernel: rbf
      bandwidth: 1
      reg: 1e-9
    hyperparameters:
      shared:
        bandwidth:
          type: float
          min: 0.1
          max: 10
      owned:
        reg:
          type: float
          min: 1e-12
          max: 1e-4

experiments:
  experiment1:
    name: Similarity vs Noise
    sweeps:
      noise:
        min: 0
        max: 2
        n_steps: 20
    model: krr_model
    plots:
      - similarities
      - max_similarities
      - 
  
