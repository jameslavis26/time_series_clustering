  experiment1_eigen:
    name: Similarity vs Noise
    sweeps:
      noise:
        type: float
        min: 0
        max: 2
        n_steps: 20
    model: eigen_rascutti

  experiment2_eigen:
    name: Similarity vs Correlated Dim
    sweeps:
      n_correlated_dims:
        type: int
        min: 2
        max: 10
        step: 1
    model: eigen_rascutti

  experiment3_eigen:
    name: Similarity vs Uncorrelated Dim
    sweeps:
      n_uncorrelated_dims:
        type: int
        min: 0
        max: 10
